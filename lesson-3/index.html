<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>tour booking </title>
</head>
<body>
  <h1>JAPAN TRIP<br>BOOKING</h1>
  <div class="form">
    <form class="sub_form">
      <fieldset>
      <legend>Contact Information</legend>
      <label for="name"> Your name</label> 
      <input type="text" id="name" name="name" required/><br>
      <label for="phone"> Phone number</label> 
      <input type="tel" id="phone" name="phone" required/><br>
      <label for="email"> Email</label> 
      <input type="email" id="phone" name="email" required/><br>
      </fieldset>
      <fieldset>
      <legend>Personal Information</legend>
      <label for="age"> Your age</label> 
      <input type="number" id="age" min="18" required/> <br>
      <label for="gender"> Choose your gender</label> 
      <select id="gender" name="gender">
       <option value="male">Male</option>
       <option value="female">Female</option>
      </select><br>
      </fieldset>
      <fieldset>
      <legend>Preferences</legend><br>
      <label for="date"> Select a date</label> 
      <input type="date" id="date" name="date"required><br>
      <label for="radio">Tour type</label>
      <input type="radio" name="tour-type" value="individual">
       Individual
      <input type="radio" name="tour-type" value="group">
       Group<br>
      <label for="text">Additional comments</label>
      <textarea id="text" rows="3" cols="20"></textarea><br>
      </fieldset>
      <input type="submit" value="Send">
    </form>
  </div>>
  </body>
</html>
