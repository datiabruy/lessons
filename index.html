<!DOCTYPE html>
<html lang="en">
   <header>
    <meta charset="UTF-8">
    <title>tour booking </title>
    <link rel="stylesheet" type="text/css" href="C:\Users\denis\Desktop\l3\styles.css">
  <body>
   <header>
    <h1>JAPAN TRIP<br>BOOKING</h1>
   </header>
   <main>
      <div class="form">
        <form class="sub_form">
        <fieldset>
            <legend>Contact Information</legend>
            <label for="name"> Your name</label> 
            <input type="text" id="name" name="name" required/>
            <label for="phone"> Phone number</label> 
            <input type="tel" id="phone" name="phone" max="10" required/>
            <hr>
            <label for="email"> Email</label> 
            <input type="email" id="phone" name="email" required/>
        </fieldset>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="age"> Your age</label> 
            <input type="number" id="age" min="18" required/> 
            <label for="gender"> Choose your gender</label> 
            <select id="gender" name="gender">
             <option value="male">Male</option>
             <option value="female">Female</option>
            </select><br>
        </fieldset>
        <fieldset>
            <legend>Preferences</legend><br>
            <label for="date"> Select a date</label> 
            <input type="date" id="date" name="date"required>
            <label for="tour-type">Tour type</label>
            <div class="radio-group">
              <label class="radio-option">Individual
              <input type="radio" name="tour-type" value="individual">
              </label>
              <label class="radio-option">Group
              <input type="radio" name="tour-type" value="group">
              </label>
            </div>
            <br>
            <label for="text">Additional comments</label>
            <textarea id="text" rows="3" cols="20"></textarea><br>
        </fieldset>
        <input type="submit" value="Send">
      </form>
      </div>
   </main>
  </body>
</html>
